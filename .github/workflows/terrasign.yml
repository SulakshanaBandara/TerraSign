name: TerraSign Separation of Duties

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ── Job 1: CI pipeline creates plan and submits for admin review ──────────
  plan:
    name: Terraform Plan & Submit for Review
    runs-on: ubuntu-latest
    outputs:
      plan_id: ${{ steps.submit.outputs.plan_id }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Build TerraSign from source
      run: go build -o $HOME/go/bin/terrasign ./cmd/terrasign/

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false

    - name: Terraform Init
      run: terraform init
      working-directory: examples/simple-app

    - name: Terraform Plan
      run: terraform plan -out=tfplan
      working-directory: examples/simple-app

    - name: Submit Plan for Review
      id: submit
      working-directory: examples/simple-app
      env:
        TERRASIGN_SERVICE: ${{ secrets.TERRASIGN_SERVICE_URL }}
      run: |
        export PATH=$PATH:$HOME/go/bin
        OUTPUT=$(terrasign submit-for-review --service "$TERRASIGN_SERVICE" tfplan)
        echo "$OUTPUT"
        PLAN_ID=$(echo "$OUTPUT" | grep "Submission ID:" | awk '{print $3}')
        if [ -z "$PLAN_ID" ]; then
          echo "ERROR: Failed to extract plan ID from output"
          exit 1
        fi
        echo "plan_id=$PLAN_ID" >> $GITHUB_OUTPUT
        echo "Plan submitted with ID: $PLAN_ID"

    - name: Upload Plan Artifact
      uses: actions/upload-artifact@v4
      with:
        name: terraform-plan
        path: examples/simple-app/tfplan
        retention-days: 1

  # ── Job 2: Apply only after admin approval (GitHub environment gate) ──────
  apply:
    name: Terraform Apply (After Admin Approval)
    runs-on: ubuntu-latest
    needs: plan
    environment: production   # Requires manual approval configured in GitHub repo settings

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Build TerraSign from source
      run: go build -o $HOME/go/bin/terrasign ./cmd/terrasign/

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false

    - name: Terraform Init
      run: terraform init
      working-directory: examples/simple-app

    - name: Download Signed Plan
      uses: actions/download-artifact@v4
      with:
        name: terraform-plan
        path: examples/simple-app

    - name: Download Signature
      working-directory: examples/simple-app
      env:
        TERRASIGN_SERVICE: ${{ secrets.TERRASIGN_SERVICE_URL }}
        PLAN_ID: ${{ needs.plan.outputs.plan_id }}
      run: |
        curl -f -o tfplan.sig "${TERRASIGN_SERVICE}/download/${PLAN_ID}/signature"
        echo "Signature downloaded for plan: $PLAN_ID"

    - name: Terraform Apply (Signature Verified)
      working-directory: examples/simple-app
      env:
        ADMIN_PUBLIC_KEY_CONTENT: ${{ secrets.ADMIN_PUBLIC_KEY_CONTENT }}
      run: |
        export PATH=$PATH:$HOME/go/bin
        # Write the admin public key from secret to a temp file
        echo "$ADMIN_PUBLIC_KEY_CONTENT" > /tmp/admin.pub
        terrasign wrap --key /tmp/admin.pub -- apply tfplan
        rm -f /tmp/admin.pub
